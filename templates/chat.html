<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Parea 🔥 Live Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Roboto:wght@400;700&family=Orbitron:wght@700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        :root {
            --comic-yellow: #FFDE00;
            --comic-orange: #FF6B00;
            --gold: #D4AF37;
            --red: #ff4444;
            --bg-dark: #0a0c16;
        }

        html, body {
            min-height: 100vh;
            margin: 0; padding: 0;
            font-family: 'Fredoka', cursive, 'Roboto', sans-serif;
            background: radial-gradient(circle at center, #1a1c2e 0%, #080911 100%);
            color: #ffffff;
            display: flex; flex-direction: column;
            overflow-x: hidden;
        }

        /* 🌫️ DYNAMIC BACKGROUND MIST */
        .mist-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none; overflow: hidden;
        }
        .mist-layer {
            position: absolute; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255, 107, 0, 0.15) 0%, rgba(212, 175, 55, 0.1) 40%, transparent 70%);
            filter: blur(50px);
            animation: mistFloat 18s ease-in-out infinite alternate;
        }
        @keyframes mistFloat {
            0% { transform: translate(-10%, -10%) rotate(0deg) scale(1); }
            100% { transform: translate(10%, 10%) rotate(10deg) scale(1.15); }
        }

        /* 🚀 TOP NAVBAR (ΜΕ ΤΟΝ PLAYER ΤΟΥ INDEX) */
        .top-navbar {
            width: 100%; height: 60px;
            background: rgba(10, 12, 22, 0.9);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 3px solid var(--comic-yellow);
            padding: 0 20px; box-sizing: border-box;
            display: flex; flex-direction: row; align-items: center; justify-content: space-between;
            gap: 15px; z-index: 1000;
            box-shadow: 0 5px 25px rgba(0,0,0,0.9);
        }

        .brand-title {
            font-size: 1.3em; font-weight: 700; color: var(--comic-yellow);
            text-transform: uppercase; white-space: nowrap;
            -webkit-text-stroke: 1px #000; text-shadow: 2px 2px 0px #FF4500;
        }

        /* 🍄 INDEX PLAYER (MUSHROOM STYLE) */
        .custom-player {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 14px 4px 10px; border-radius: 50px;
            border: 2px solid var(--comic-yellow);
            box-shadow: 0 0 12px rgba(255, 222, 0, 0.3);
        }

        .mushroom-btn {
            background: none; border: none; cursor: pointer; font-size: 1.8em;
            padding: 0; margin: 0; display: flex; align-items: center; justify-content: center;
            filter: drop-shadow(0px 3px 0px #000); transition: transform 0.15s ease;
            user-select: none; line-height: 1;
        }
        .mushroom-btn:hover { transform: scale(1.15) rotate(-5deg); }
        .mushroom-btn.playing { animation: mushroomPulse 1.2s infinite alternate ease-in-out; }

        @keyframes mushroomPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        .volume-slider { width: 65px; accent-color: var(--comic-yellow); cursor: pointer; }

        /* 🎧 DJ ON AIR INFO */
        .dj-onair-box {
            display: flex; align-items: center; gap: 8px;
            background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold);
            padding: 3px 10px; border-radius: 20px;
        }
        .dj-avatar-small { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--gold); object-fit: cover; }

        /* USER ACTIONS (ΧΩΡΙΣ ΚΟΥΜΠΙ ΣΥΝΔΕΣΗΣ) */
        .user-nav-actions { display: flex; align-items: center; gap: 10px; }

        .nav-btn {
            background: rgba(212,175,55,0.15); border: 1px solid var(--gold);
            color: #fff; padding: 6px 14px; border-radius: 20px;
            cursor: pointer; font-size: 0.85em; font-weight: bold;
            display: flex; align-items: center; gap: 6px; transition: all 0.2s; text-decoration: none;
        }
        .nav-btn:hover { background: var(--gold); color: #000; }
        .nav-btn.logout { border-color: var(--red); color: var(--red); }
        .nav-btn.logout:hover { background: var(--red); color: #fff; }

        /* 📐 MAIN CHAT LAYOUT */
        .main { 
            display: flex !important; flex-direction: row !important; 
            width: 100vw; height: calc(100vh - 60px); 
            margin: 0; padding: 0; overflow: hidden; position: relative; z-index: 2;
        }

        #chat-window { flex: 1; display: flex; flex-direction: column; height: 100%; }

        #chat-box {
            flex: 1; overflow-y: auto; padding: 20px;
            background: linear-gradient(135deg, rgba(15, 18, 35, 0.85), rgba(5, 7, 15, 0.92));
            backdrop-filter: blur(10px);
            border-right: 2px solid rgba(212, 175, 55, 0.25);
            position: relative; z-index: 2;
        }

        .message { 
            background: rgba(255, 255, 255, 0.03) !important; border-radius: 10px;
            padding: 8px 12px; margin-bottom: 10px; color: white !important;
            text-shadow: 1px 1px 3px #000; font-size: 1.05em;
            border: 1px solid rgba(255, 255, 255, 0.05); transition: background 0.2s ease;
        }

        .message-avatar { width: 38px !important; height: 38px !important; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold); }
        .msg-time { font-size: 0.75em; color: #aaa; margin-left: 8px; }
        .message-content { word-break: break-word; font-size: 16px !important; line-height: 1.5; }

        /* INPUT AREA */
        .input-area { 
            background: rgba(8, 10, 20, 0.98); padding: 12px 18px; 
            border-top: 2px solid var(--gold); z-index: 10;
        }

        .toolbar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
        
        #chat-input { 
            flex: 1; padding: 12px 15px; border-radius: 12px; 
            border: 2px solid var(--gold); background: #0d0e18; color: white; 
            outline: none; min-height: 42px; font-size: 1.1em; box-sizing: border-box;
        }

        .tool-btn { 
            background: rgba(212,175,55,0.1); border: 1px solid var(--gold); 
            color: white; padding: 6px 12px; border-radius: 8px; 
            cursor: pointer; font-size: 13px; font-weight: bold; 
        }

        /* SIDEBAR ONLINE USERS */
        .sidebar { 
            width: 240px !important; min-width: 240px; height: 100%;
            background: rgba(6, 8, 16, 0.92); 
            border-left: 2px solid rgba(212, 175, 55, 0.3); 
            display: flex; flex-direction: column;
        }

        #user-list-content { flex: 1; overflow-y: auto; padding: 10px; }

        /* MODAL PROFILE */
        .modal { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
        .modal-content { background: #121424; margin: 8% auto; padding: 25px; border: 2px solid var(--gold); width: 320px; border-radius: 20px; color: white; }
    </style>
</head>
<body>

    <div class="mist-container"><div class="mist-layer"></div></div>
    
    <!-- 🚀 NAVBAR CHAT (ΜΕ ΤΟΝ PLAYER ΤΟΥ INDEX) -->
    <div class="top-navbar">
        <div class="brand-title">📻 RADIOPAREA</div>

        <!-- 🍄 PLAYER ΑΠΟ INDEX -->
        <div class="custom-player">
            <button id="play-pause-btn" class="mushroom-btn" title="Play / Pause">🍄</button>
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <span id="playerStateText" style="color: var(--comic-yellow); font-size: 0.7em; font-weight: bold;">CLICK TO PLAY</span>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <span style="font-size: 0.8em;">🔊</span>
                    <input type="range" id="volume-control" class="volume-slider" min="0" max="1" step="0.05" value="0.8">
                </div>
            </div>
        </div>

        <!-- 🎧 DJ ON AIR INFO -->
        <div class="dj-onair-box">
            <img src="https://i.imgur.com/6VBx3io.png" class="dj-avatar-small" alt="DJ">
            <span style="font-size: 0.75em; color: var(--gold); font-weight: bold;">ON AIR: <span style="color: #fff;">MA BAKER</span></span>
        </div>

        <!-- USER ACTIONS (ΠΡΟΦΙΛ + ΕΞΟΔΟΣ - ΧΩΡΙΣ LOGIN) -->
        <div class="user-nav-actions">
            <button onclick="document.getElementById('setModal').style.display='block'" class="nav-btn">
                <i class="fas fa-user-circle"></i> <span>{{ current_user.display_name }}</span>
            </button>
            <a href="{{ url_for('logout') }}" class="nav-btn logout">
                <i class="fas fa-power-off"></i> <span>ΕΞΟΔΟΣ</span>
            </a>
        </div>
    </div>

    <!-- 📐 CHAT WINDOW & ONLINE USERS -->
    <div class="main">
        <div id="chat-window"> 
            
            <div id="chat-box">
                {% for msg in history %}
                <div class="message" id="msg-{{ msg.id }}" style="margin-bottom: 12px; display: flex; align-items: flex-start; gap: 10px;">
                    <img src="{{ msg.author.avatar_url or 'https://ui-avatars.com/api/?name=' + msg.author.display_name }}" class="message-avatar">
                    <div style="display: flex; flex-direction: column;">
                        <div style="display: flex; align-items: baseline; gap: 8px;">
                            <strong style="color: {{ msg.author.color }}; font-size: 0.9em;">{{ msg.author.display_name }}:</strong>
                            <span class="msg-time">{{ msg.timestamp.strftime("%H:%M %d.%m.%Y") }}</span>
                            <i class="fas fa-reply" onclick="replyTo('{{ msg.author.display_name }}')" style="cursor:pointer; font-size:0.75em; color:var(--gold); margin-left:6px;"></i>
                            {% if current_user.role in ['admin', 'owner'] %}
                            <i class="fas fa-trash" onclick="deleteMsg({{ msg.id }})" style="cursor:pointer; font-size:0.75em; color:red; margin-left:5px;"></i>
                            {% endif %}
                        </div>
                        <span class="message-content" style="color: white;">{{ msg.content | safe }}</span>
                    </div>
                </div>
                {% endfor %}
            </div>

            <!-- CHAT INPUT AREA -->
            <div class="input-area">
                <div class="toolbar">
                    <button type="button" class="tool-btn" onclick="document.execCommand('bold')"><b>B</b></button>
                    <button type="button" class="tool-btn" onclick="document.execCommand('italic')"><i>I</i></button>
                    <input type="color" onchange="document.execCommand('foreColor', false, this.value)" style="width:28px; height:28px; cursor:pointer; vertical-align:middle; border-radius:4px; border:none;">
                    <button type="button" class="tool-btn">😊</button>
                    <button type="button" class="tool-btn">GIF</button>
                </div>

                <div style="display:flex; gap:10px; align-items: center; margin-top: 5px;">
                    <div id="chat-input" contenteditable="true" placeholder="Γράψτε κάτι..."></div>
                    <button onclick="sendMessage()" style="background:var(--gold); border:none; padding:10px 25px; border-radius:10px; font-weight:bold; cursor:pointer; height:42px;">ΣΤΕΙΛΕ</button>
                </div> 
            </div> 
        </div> 

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div style="color:var(--gold); font-weight:bold; padding: 12px 0; font-family: 'Orbitron'; text-align:center; border-bottom: 1px solid rgba(212,175,55,0.2);">
                <i class="fas fa-users"></i> ONLINE
            </div>
            <div id="user-list-content"></div>
        </div>
    </div>

    <!-- MODAL PROFILE -->
    <div id="setModal" class="modal">
        <div class="modal-content">
            <h3 style="text-align:center; color:var(--gold); margin-top:0;">ΡΥΘΜΙΣΕΙΣ ΠΡΟΦΙΛ</h3>
            <label style="font-size:0.85em;">Όνομα:</label>
            <input type="text" id="new-nickname" value="{{ current_user.display_name }}" style="width:100%; padding:8px; margin:8px 0; background:#0a0b12; color:white; border:1px solid var(--gold); border-radius:6px;">
            <button onclick="document.getElementById('setModal').style.display='none'" style="width:100%; background:var(--gold); border:none; padding:10px; margin-top:10px; cursor:pointer; font-weight:bold; border-radius:8px;">ΚΛΕΙΣΙΜΟ</button>
        </div>
    </div>

    <!-- JS LOGIC -->
    <script>
        const socket = io();
        const chatInput = document.getElementById('chat-input');
        const chatBox = document.getElementById('chat-box');

        /* STREAM PLAYER */
        const audio = new Audio('https://or.mysonicserver.com:8050/;');
        audio.volume = 0.8;
        const playBtn = document.getElementById('play-pause-btn');
        const stateText = document.getElementById('playerStateText');

        playBtn.onclick = () => {
            if (audio.paused) {
                audio.play();
                playBtn.classList.add('playing');
                stateText.innerText = "ON AIR 🎶";
                stateText.style.color = "#2ECC71";
            } else {
                audio.pause();
                playBtn.classList.remove('playing');
                stateText.innerText = "PAUSED 🍄";
                stateText.style.color = "#FFDE00";
            }
        };

        document.getElementById('volume-control').oninput = function() { audio.volume = this.value; };

        function sendMessage() {
            const content = chatInput.innerHTML.trim();
            if(content && content !== '<br>') {
                socket.emit('message', { content: content });
                chatInput.innerHTML = '';
            }
        }

        socket.on("message", data => {
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<strong style="color:${data.color}">${data.display_name}:</strong> <span>${data.content}</span>`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>
</body>
</html>
