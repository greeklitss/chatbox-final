<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Parea 🔥 Live Chat & Radio</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Roboto:wght@400;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        :root {
            --comic-yellow: #FFDE00;
            --gold: #D4AF37;
            --red: #ff4444;
            --green: #00FF66;
            --bg-dark: #0a0c16;
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100vh; margin: 0; padding: 0;
            font-family: 'Fredoka', 'Roboto', sans-serif;
            background: #000; color: #ffffff;
            overflow: hidden;
        }

        /* 🚀 TOP NAVBAR INDEX */
        .top-navbar {
            width: 100vw; height: 60px; background: rgba(10, 12, 22, 0.95);
            border-bottom: 2px solid var(--gold); padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
            position: relative; z-index: 1000;
        }

        .brand-title {
            font-size: 1.3em; font-weight: 700; color: var(--comic-yellow);
            text-transform: uppercase; -webkit-text-stroke: 1px #000; text-shadow: 2px 2px 0px #FF4500;
        }

        .custom-player {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.05); padding: 4px 14px;
            border-radius: 50px; border: 2px solid var(--comic-yellow);
        }
        .mushroom-btn { background: none; border: none; cursor: pointer; font-size: 1.6em; line-height: 1; }

        .dj-onair-box {
            display: flex; align-items: center; gap: 8px;
            background: rgba(212, 175, 55, 0.1); border: 1px solid var(--gold);
            padding: 4px 12px; border-radius: 20px; font-size: 0.85em;
        }

        .nav-btn {
            background: rgba(212,175,55,0.15); border: 1px solid var(--gold);
            color: #fff; padding: 6px 14px; border-radius: 20px; cursor: pointer;
            font-size: 0.85em; font-weight: bold; text-decoration: none;
            display: flex; align-items: center; gap: 6px;
        }
        .nav-btn.logout { border-color: var(--red); color: var(--red); }

        /* 📐 SPLIT 50/50 CONTAINER */
        .split-wrapper {
            display: grid; grid-template-columns: 50% 50%;
            width: 100vw; height: calc(100vh - 60px);
            position: relative;
        }

        /* 🖼️ ΑΡΙΣΤΕΡΑ: ΑΥΤΟΥΣΙΟ ΤΟ ΕΙΚΑΣΤΙΚΟ ΤΟΥ INDEX */
        .index-visual-side {
            position: relative;
            background: url('https://i.imgur.com/your-smurfs-bg.jpg') center/cover no-repeat; /* Βάλε το URL της εικόνας σου */
            display: flex; flex-direction: column; justify-content: space-between;
            padding: 20px; border-right: 2px solid var(--gold);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
        }

        /* Στρογγυλό σχήμα/πλαίσιο αν η εικόνα είναι σε κύκλο */
        .smurf-banner-container {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        .smurf-image {
            max-width: 90%; max-height: 85%;
            object-fit: contain; border-radius: 50%;
            filter: drop-shadow(0 0 25px rgba(255,222,0,0.4));
        }

        /* DJ CARD & AUDIENCE (Κάτω Αριστερά) */
        .dj-card-overlay {
            position: absolute; bottom: 20px; left: 20px;
            display: flex; align-items: center; gap: 12px;
            background: rgba(10, 12, 22, 0.85); border: 2px solid var(--gold);
            padding: 8px 15px; border-radius: 15px; backdrop-filter: blur(8px);
        }
        .dj-avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--comic-yellow); object-fit: cover; }

        /* 💬 ΔΕΞΙΑ: ΑΥΤΟΥΣΙΟ ΤΟ CHAT ΚΑΙ ONLINE LIST */
        .chat-full-side {
            display: flex; flex-direction: row; height: 100%;
            background: rgba(8, 10, 20, 0.98);
        }

        .chat-container { flex: 1; display: flex; flex-direction: column; height: 100%; }

        #chat-messages {
            flex: 1; overflow-y: auto; padding: 15px;
            background: rgba(15, 18, 35, 0.6);
        }

        .msg-card {
            background: rgba(255, 255, 255, 0.04); border-radius: 10px;
            padding: 8px 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05);
        }

        .chat-input-area {
            padding: 12px; background: rgba(5, 7, 15, 0.95);
            border-top: 2px solid var(--gold);
        }

        .chat-toolbar { display: flex; gap: 6px; margin-bottom: 8px; }
        
        #editable-input {
            width: 100%; min-height: 42px; background: #0a0b12;
            border: 2px solid var(--gold); border-radius: 8px;
            color: white; padding: 8px 12px; outline: none;
        }

        .sidebar-online {
            width: 160px; height: 100%; background: #060810;
            border-left: 1px solid rgba(212,175,55,0.3); padding: 10px;
        }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); }
        .modal-content { background: #121424; margin: 10% auto; padding: 20px; border: 2px solid var(--gold); width: 300px; border-radius: 15px; }
    </style>
</head>
<body>

    <!-- 🚀 TOP NAVBAR INDEX -->
    <div class="top-navbar">
        <div class="brand-title">📻 RADIOPAREA</div>

        <div class="custom-player">
            <button id="play-btn" class="mushroom-btn">🍄</button>
            <span id="player-status" style="color: var(--comic-yellow); font-size: 0.75em; font-weight: bold;">LIVE STREAM</span>
            <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8" style="width:60px; accent-color: var(--comic-yellow);">
        </div>

        <div class="dj-onair-box">
            <span style="color: var(--green);">●</span>
            <span style="color: var(--gold); font-weight: bold;">ON AIR: <span style="color: #fff;">MA BAKER</span></span>
        </div>

        <div style="display:flex; gap:10px;">
            <button onclick="document.getElementById('setModal').style.display='block'" class="nav-btn">
                <i class="fas fa-user-circle"></i> {{ current_user.display_name }}
            </button>
            <a href="{{ url_for('logout') }}" class="nav-btn logout">
                <i class="fas fa-power-off"></i> ΕΞΟΔΟΣ
            </a>
        </div>
    </div>

    <!-- 📐 SPLIT 50 / 50 -->
    <div class="split-wrapper">

        <!-- 🖼️ ΑΡΙΣΤΕΡΑ: ΕΙΚΑΣΤΙΚΟ INDEX (ΣΤΡΟΥΜΦ) -->
        <div class="index-visual-side">
            <div class="smurf-banner-container">
                <!-- Βάλε το δικό σου αρχείο εικόνας των Στρουμφ -->
                <img src="/static/images/smurfs_main.png" class="smurf-image" alt="RadioParea Smurfs">
            </div>

            <!-- DJ CARD OVERLAY (Κάτω Αριστερά) -->
            <div class="dj-card-overlay">
                <img src="https://i.imgur.com/6VBx3io.png" class="dj-avatar" alt="MABAKER">
                <div>
                    <div style="color: var(--gold); font-weight: bold; font-size: 0.9em;">MA BAKER</div>
                    <div style="font-size: 0.75em; color: #aaa;">ΑΚΡΟΑΤΕΣ: <span style="color:var(--comic-yellow); font-weight:bold;">3</span></div>
                </div>
            </div>
        </div>

        <!-- 💬 ΔΕΞΙΑ: ΑΥΤΟΥΣΙΟ ΤΟ CHAT -->
        <div class="chat-full-side">
            <div class="chat-container">
                
                <div id="chat-messages">
                    {% for msg in history %}
                    <div class="msg-card">
                        <strong style="color: {{ msg.author.color }}; font-size:0.9em;">{{ msg.author.display_name }}:</strong>
                        <span style="font-size:0.95em; color:#fff;">{{ msg.content | safe }}</span>
                    </div>
                    {% endfor %}
                </div>

                <div class="chat-input-area">
                    <div class="chat-toolbar">
                        <button onclick="document.execCommand('bold')" class="nav-btn" style="padding:2px 8px;"><b>B</b></button>
                        <button onclick="document.execCommand('italic')" class="nav-btn" style="padding:2px 8px;"><i>I</i></button>
                        <button class="nav-btn" style="padding:2px 8px;">😊</button>
                        <button class="nav-btn" style="padding:2px 8px;">GIF</button>
                    </div>

                    <div style="display:flex; gap:8px;">
                        <div id="editable-input" contenteditable="true" placeholder="Γράψε μήνυμα..."></div>
                        <button onclick="sendMsg()" style="background:var(--gold); border:none; padding:0 20px; border-radius:8px; font-weight:bold; cursor:pointer;">ΣΤΕΙΛΕ</button>
                    </div>
                </div>

            </div>

            <div class="sidebar-online">
                <div style="color:var(--gold); font-weight:bold; font-size:0.8em; text-align:center; border-bottom:1px solid rgba(212,175,55,0.3); padding-bottom:8px;">
                    🟢 ONLINE
                </div>
                <div id="online-users" style="margin-top:10px;"></div>
            </div>
        </div>

    </div>

    <!-- MODAL PROFILE -->
    <div id="setModal" class="modal">
        <div class="modal-content">
            <h3 style="text-align:center; color:var(--gold); margin-top:0;">ΠΡΟΦΙΛ</h3>
            <input type="text" value="{{ current_user.display_name }}" style="width:100%; padding:8px; background:#000; color:#fff; border:1px solid var(--gold); border-radius:5px;">
            <button onclick="document.getElementById('setModal').style.display='none'" style="width:100%; background:var(--gold); border:none; padding:8px; margin-top:10px; font-weight:bold; cursor:pointer;">ΚΛΕΙΣΙΜΟ</button>
        </div>
    </div>

    <script>
        const socket = io();
        function sendMsg() {
            const input = document.getElementById('editable-input');
            if(input.innerHTML.trim() !== '') {
                socket.emit('message', { content: input.innerHTML });
                input.innerHTML = '';
            }
        }
        socket.on("message", data => {
            const div = document.createElement('div');
            div.className = 'msg-card';
            div.innerHTML = `<strong style="color:${data.color}">${data.display_name}:</strong> <span>${data.content}</span>`;
            const box = document.getElementById('chat-messages');
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
    </script>
</body>
</html>
