<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RadioParea 🔥 Live Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        :root {
            --comic-yellow: #FFDE00;
            --gold: #D4AF37;
            --red: #ff4444;
            --green: #00FF66;
            --bg-dark: #0a0c16;
        }

        * { box-sizing: border-box; }

        html, body {
            min-height: 100vh; margin: 0; padding: 0;
            font-family: 'Fredoka', 'Roboto', sans-serif;
            background: #000; color: #ffffff;
            overflow: hidden;
        }

        /* --------------------------------------------------
           1. HEADER (Top Bar)
        -------------------------------------------------- */
        .top-navbar {
            width: 100vw; height: 60px; background: rgba(10, 12, 22, 0.95);
            border-bottom: 2px solid var(--gold); padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between;
            position: relative; z-index: 1000;
        }

        .brand-title {
            font-size: 1.3em; font-weight: 700; color: var(--comic-yellow);
            text-transform: uppercase; -webkit-text-stroke: 1px #000; text-shadow: 2px 2px 0px #FF4500;
        }

        .custom-player {
            display: flex; align-items: center; gap: 10px;
            background: rgba(255, 255, 255, 0.05); padding: 4px 14px;
            border-radius: 50px; border: 2px solid var(--comic-yellow);
        }
        .mushroom-btn { background: none; border: none; cursor: pointer; font-size: 1.6em; line-height: 1; }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .nav-btn {
            background: rgba(212,175,55,0.15); border: 1px solid var(--gold);
            color: #fff; padding: 6px 12px; border-radius: 20px; cursor: pointer;
            font-size: 0.85em; font-weight: bold; text-decoration: none;
            display: flex; align-items: center; gap: 6px; transition: 0.2s;
        }
        .nav-btn:hover { background: var(--gold); color: #000; }
        .nav-btn.clear-btn { border-color: var(--comic-yellow); color: var(--comic-yellow); }
        .nav-btn.clear-btn:hover { background: var(--comic-yellow); color: #000; }
        .nav-btn.logout { border-color: var(--red); color: var(--red); }
        .nav-btn.logout:hover { background: var(--red); color: #fff; }

        /* --------------------------------------------------
           MAIN SPLIT WRAPPER (40% / 60%)
        -------------------------------------------------- */
        .split-wrapper {
            display: grid; grid-template-columns: 40% 60%;
            width: 100vw; height: calc(100vh - 60px);
            position: relative;
        }

        /* --------------------------------------------------
           2. ΑΡΙΣΤΕΡΑ (40%): BACKGROUND & DJ METADATA (INDEX)
        -------------------------------------------------- */
        .index-visual-side {
            position: relative;
            background: url('/static/images/bg_main.jpg') center/cover no-repeat;
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            padding: 20px; border-right: 2px solid var(--gold);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.85);
            overflow: hidden;
        }

        .smurf-banner-container {
            position: relative; z-index: 2;
            width: 100%; height: 80%;
            display: flex; align-items: center; justify-content: center;
        }

        .smurf-image {
            max-width: 95%; max-height: 90%; object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(255,222,0,0.5));
        }

        /* DJ METADATA CARD (Κάτω Αριστερά) */
        .dj-card-overlay {
            position: relative; z-index: 2; width: 100%;
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(10, 12, 22, 0.88); border: 2px solid var(--gold);
            padding: 10px 15px; border-radius: 15px; backdrop-filter: blur(8px);
        }
        .dj-info { display: flex; align-items: center; gap: 12px; }
        .dj-avatar { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--comic-yellow); object-fit: cover; }
        .listeners-badge {
            background: rgba(255, 222, 0, 0.15); border: 1px solid var(--comic-yellow);
            padding: 4px 10px; border-radius: 12px; font-size: 0.8em; font-weight: bold; color: var(--comic-yellow);
        }

        /* --------------------------------------------------
           3. ΔΕΞΙΑ (60%): CHAT + SLIDE ONLINE + TOOLBAR
        -------------------------------------------------- */
        .chat-full-side {
            display: flex; flex-direction: row; height: 100%;
            background: rgba(8, 10, 20, 0.98); position: relative;
        }

        .chat-container { flex: 1; display: flex; flex-direction: column; height: 100%; }

        #chat-messages {
            flex: 1; overflow-y: auto; padding: 15px;
            background: rgba(15, 18, 35, 0.6);
            display: flex; flex-direction: column; gap: 10px;
        }

        .msg-card {
            background: rgba(255, 255, 255, 0.04); border-radius: 10px;
            padding: 10px 14px; border: 1px solid rgba(255,255,255,0.06);
            word-break: break-word; position: relative;
        }
        .msg-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .msg-author { font-weight: bold; font-size: 0.95em; }
        .msg-time { font-size: 0.75em; color: #888; }

        /* CHAT TOOLBAR & INPUT AREA */
        .chat-input-area {
            padding: 12px; background: rgba(5, 7, 15, 0.95);
            border-top: 2px solid var(--gold);
        }

        .chat-toolbar { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
        .tool-btn {
            background: rgba(255,255,255,0.08); border: 1px solid var(--gold);
            color: #fff; padding: 4px 10px; border-radius: 6px; cursor: pointer;
            font-size: 0.85em; transition: 0.2s;
        }
        .tool-btn:hover { background: var(--gold); color: #000; }

        #editable-input {
            width: 100%; min-height: 44px; max-height: 100px; overflow-y: auto;
            background: #0a0b12; border: 2px solid var(--gold); border-radius: 8px;
            color: white; padding: 10px 12px; outline: none; font-size: 0.95em;
        }
        #editable-input:empty:before { content: attr(placeholder); color: #666; display: block; }

        .btn-send {
            background: var(--gold); border: none; padding: 0 22px;
            border-radius: 8px; font-weight: bold; cursor: pointer;
            color: #000; font-size: 1em; transition: 0.2s;
        }
        .btn-send:hover { background: var(--comic-yellow); box-shadow: 0 0 10px var(--comic-yellow); }

        /* SLIDE SIDEBAR FOR ONLINE USERS */
        .sidebar-online {
            width: 180px; height: 100%; background: #060810;
            border-left: 1px solid rgba(212,175,55,0.3); padding: 12px;
            display: flex; flex-direction: column; transition: transform 0.3s ease;
        }
        .online-title {
            color: var(--gold); font-weight: bold; font-size: 0.85em;
            text-align: center; border-bottom: 1px solid rgba(212,175,55,0.3);
            padding-bottom: 8px; margin-bottom: 10px;
        }

        /* MODAL PROFILE */
        .modal { display: none; position: fixed; z-index: 3000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); }
        .modal-content { background: #121424; margin: 12% auto; padding: 22px; border: 2px solid var(--gold); width: 320px; border-radius: 15px; }
        .modal-input { width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid var(--gold); border-radius: 8px; margin-top: 10px; outline: none; }
    </style>
</head>
<body>

    <!-- ==================================================
         1. HEADER (PLAYER, ΣΚΟΥΠΑ, ΠΡΟΦΙΛ, ΕΞΟΔΟΣ)
    ================================================== -->
    <div class="top-navbar">
        <div class="brand-title">📻 RADIOPAREA</div>

        <!-- PLAYER -->
        <div class="custom-player">
            <button id="play-btn" class="mushroom-btn" onclick="togglePlay()">🍄</button>
            <span id="player-status" style="color: var(--comic-yellow); font-size: 0.75em; font-weight: bold;">LIVE STREAM</span>
            <input type="range" id="vol" min="0" max="1" step="0.05" value="0.8" oninput="setVolume(this.value)" style="width:65px; accent-color: var(--comic-yellow);">
            <audio id="radio-audio" src="https://stream.radioparea.gr/live"></audio>
        </div>

        <!-- HEADER ACTION BUTTONS -->
        <div class="header-actions">
            <!-- ΣΚΟΥΠΑ -->
            <button onclick="clearChatScreen()" class="nav-btn clear-btn" title="Καθαρισμός Οθόνης Chat">
                <i class="fas fa-broom"></i> Σκουπα
            </button>

            <!-- ΠΡΟΦΙΛ -->
            <button onclick="document.getElementById('setModal').style.display='block'" class="nav-btn">
                <i class="fas fa-user-circle"></i> {{ current_user.display_name }}
            </button>

            <!-- ΕΞΟΔΟΣ -->
            <a href="{{ url_for('logout') }}" class="nav-btn logout">
                <i class="fas fa-power-off"></i> Έξοδος
            </a>
        </div>
    </div>

    <!-- ==================================================
         MAIN CONTENT SPLIT (40% / 60%)
    ================================================== -->
    <div class="split-wrapper">

        <!-- ==============================================
             2. ΑΡΙΣΤΕΡΑ (40%): INDEX BACKGROUND & DJ METADATA
        ============================================== -->
        <div class="index-visual-side">
            <div class="smurf-banner-container">
                <img src="/static/images/smurfs_main.png" class="smurf-image" alt="RadioParea Graphics">
            </div>

            <!-- DJ METADATA -->
            <div class="dj-card-overlay">
                <div class="dj-info">
                    <img src="https://i.imgur.com/6VBx3io.png" class="dj-avatar" alt="MABAKER">
                    <div>
                        <div style="color: var(--gold); font-weight: bold; font-size: 0.95em;">ON AIR: MA BAKER</div>
                        <div style="font-size: 0.75em; color: #aaa;">Live Broadcast</div>
                    </div>
                </div>
                <div class="listeners-badge">
                    <i class="fas fa-headphones"></i> <span id="listener-count">3</span>
                </div>
            </div>
        </div>

        <!-- ==============================================
             3. ΔΕΞΙΑ (60%): CHAT + SLIDE + ALL CHAT CONTROLS
        ============================================== -->
        <div class="chat-full-side">
            <div class="chat-container">
                
                <!-- MESSAGES CONTAINER -->
                <div id="chat-messages">
                    {% for msg in history %}
                    <div class="msg-card">
                        <div class="msg-header">
                            <strong class="msg-author" style="color: {{ msg.author.color }};">{{ msg.author.display_name }}</strong>
                            <span class="msg-time">{{ msg.timestamp }}</span>
                        </div>
                        <div style="font-size:0.95em; color:#fff;">{{ msg.content | safe }}</div>
                    </div>
                    {% endfor %}
                </div>

                <!-- CHAT INPUT & TOOLBAR -->
                <div class="chat-input-area">
                    <div class="chat-toolbar">
                        <button onclick="document.execCommand('bold')" class="tool-btn"><b>B</b></button>
                        <button onclick="document.execCommand('italic')" class="tool-btn"><i>I</i></button>
                        <button onclick="document.execCommand('underline')" class="tool-btn"><u>U</u></button>
                        <button class="tool-btn">😊 Emoji</button>
                        <button class="tool-btn">🎬 GIF</button>
                        <button onclick="toggleOnlineSidebar()" class="tool-btn" style="margin-left:auto; border-color:var(--comic-yellow);">👥 Online</button>
                    </div>

                    <div style="display:flex; gap:10px;">
                        <div id="editable-input" contenteditable="true" placeholder="Γράψε μήνυμα στην παρέα..."></div>
                        <button onclick="sendMsg()" class="btn-send">ΣΤΕΙΛΕ</button>
                    </div>
                </div>

            </div>

            <!-- SLIDE PANEL FOR ONLINE USERS -->
            <div id="online-sidebar" class="sidebar-online">
                <div class="online-title">🟢 ONLINE (CHAT)</div>
                <div id="online-users" style="display:flex; flex-direction:column; gap:6px;"></div>
            </div>
        </div>

    </div>

    <!-- MODAL PROFILE -->
    <div id="setModal" class="modal">
        <div class="modal-content">
            <h3 style="text-align:center; color:var(--gold); margin-top:0;">ΠΡΟΦΙΛ ΧΡΗΣΤΗ</h3>
            <label style="font-size:0.85em; color:#aaa;">Όνομα Εμφάνισης:</label>
            <input type="text" class="modal-input" value="{{ current_user.display_name }}">
            <button onclick="document.getElementById('setModal').style.display='none'" style="width:100%; background:var(--gold); border:none; padding:10px; margin-top:15px; font-weight:bold; cursor:pointer; border-radius:8px;">ΑΠΟΘΗΚΕΥΣΗ</button>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script>
        const socket = io();

        // Player Controls
        const audio = document.getElementById('radio-audio');
        function togglePlay() {
            if (audio.paused) {
                audio.play();
                document.getElementById('player-status').innerText = 'PLAYING';
            } else {
                audio.pause();
                document.getElementById('player-status').innerText = 'PAUSED';
            }
        }
        function setVolume(val) { audio.volume = val; }

        // Clear Chat Screen (Σκούπα)
        function clearChatScreen() {
            document.getElementById('chat-messages').innerHTML = '';
        }

        // Toggle Online Sidebar
        function toggleOnlineSidebar() {
            const sb = document.getElementById('online-sidebar');
            sb.style.display = (sb.style.display === 'none') ? 'flex' : 'none';
        }

        // Send & Receive Messages
        function sendMsg() {
            const input = document.getElementById('editable-input');
            if(input.innerHTML.trim() !== '') {
                socket.emit('message', { content: input.innerHTML });
                input.innerHTML = '';
            }
        }

        socket.on("message", data => {
            const div = document.createElement('div');
            div.className = 'msg-card';
            div.innerHTML = `
                <div class="msg-header">
                    <strong class="msg-author" style="color:${data.color}">${data.display_name}</strong>
                    <span class="msg-time">${data.time || ''}</span>
                </div>
                <div>${data.content}</div>
            `;
            const box = document.getElementById('chat-messages');
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });

        // Enter key handling
        document.getElementById('editable-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMsg();
            }
        });
    </script>
</body>
</html>
