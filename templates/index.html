<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radioparea - On Air</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --comic-yellow: #FFDE00;
            --comic-orange: #FF6B00;
            --comic-green: #2ECC71;
            --text-color: #FFFFFF;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
            overflow-x: hidden;
        }

        body { 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            box-sizing: border-box;

            /* BACKGROUND */
            background-image: url("{{ url_for('static', filename='radiopareanewstyle.jpg') }}"); 
            background-size: 100% 100%;
            background-attachment: fixed;
            background-position: center center;
            background-repeat: no-repeat;
            background-color: #1a1a2e;
        }

        /* 🚀 TOP NAVBAR BAR (Λεπτή & Διακριτική) */
        .top-navbar {
            width: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-bottom: 3px solid var(--comic-yellow);
            padding: 6px 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }

        /* 1. ΛΟΓΟΤΥΠΟ */
        .brand-title {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--comic-yellow); 
            text-transform: uppercase;
            white-space: nowrap;
            -webkit-text-stroke: 1px #000;
            text-shadow: 2px 2px 0px #FF4500;
        }

        /* 🍄 2. CUSTOM MUSHROOM PLAYER */
        .custom-player {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.08);
            padding: 4px 14px 4px 10px;
            border-radius: 50px;
            border: 2px solid var(--comic-yellow);
            box-shadow: 0 0 10px rgba(255, 222, 0, 0.25);
        }

        .mushroom-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 2em;
            padding: 0;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0px 3px 0px #000);
            transition: transform 0.15s ease;
            user-select: none;
            line-height: 1;
        }

        .mushroom-btn:hover {
            transform: scale(1.15) rotate(-5deg);
        }

        .mushroom-btn.playing {
            animation: mushroomPulse 1.2s infinite alternate ease-in-out;
        }

        @keyframes mushroomPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.15); }
        }

        .volume-slider {
            width: 65px;
            accent-color: var(--comic-yellow);
            cursor: pointer;
        }

        /* 📊 3. ΜΕΤΡΗΤΕΣ ΣΤΑΤΙΣΤΙΚΩΝ */
        .stats-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 0.8em;
            color: #FFF;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .stat-value {
            font-weight: bold;
            color: var(--comic-yellow);
        }

        /* 4. ΚΟΥΜΠΙ LOGIN */
        .login-btn-top {
            background: linear-gradient(180deg, #2ECC71 0%, #27AE60 100%);
            color: #FFF; 
            border: 2px solid #000; 
            padding: 7px 18px; 
            border-radius: 30px; 
            cursor: pointer;
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
            white-space: nowrap;
            box-shadow: 0 4px 0px #1e8449;
            transition: all 0.1s ease;
            -webkit-text-stroke: 0.5px #000;
        }
        
        .login-btn-top:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 0px #1e8449;
        }

/* 🎧 FLOATING DJ CARD (INDEX) - MEGA SIZE */
.floating-dj-card {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    background: rgba(0, 0, 0, 0.85);
    padding: 12px 22px;
    border-radius: 60px;
    border: 2px solid #D4AF37;
    box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
    z-index: 999;
}

/* Μεγαλώσαμε τον κύκλο στα 85px */
#sonic_dj_img { 
    width: 85px !important; 
    height: 85px !important; 
    min-width: 85px;
    min-height: 85px;
    border-radius: 50%; 
    border: 3px solid #D4AF37; 
    box-shadow: 0 0 20px #D4AF37; 
    object-fit: cover; 
    background-color: #1a1a1a;
}

.dj-details {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

#sonic_dj { 
    font-family: 'Orbitron', sans-serif;
    font-size: 1.2em !important;
    font-weight: bold; 
    color: #D4AF37 !important;
    text-transform: uppercase;
    text-shadow: 0 0 10px #ff4400;
}

#sonic_title {
    font-size: 0.85em;
    color: #ffffff;
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
}
/* ΕΛΕΥΘΕΡΟΣ ΧΩΡΟΣ ΓΙΑ ΤΗΝ ΕΙΚΟΝΑ BACKGROUND */
.center-hero-space {
    flex: 1;
}

        @media (max-width: 768px) {
            .stats-container {
                display: none;
            }
            .floating-dj-card {
                bottom: 15px;
                left: 50%;
                transform: translateX(-50%);
                width: 90%;
                max-width: 320px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    
    <!-- 🚀 TOP NAVBAR -->
    <div class="top-navbar">
        
        <!-- 1. ΤΙΤΛΟΣ -->
        <div class="brand-title">
            📻 RADIOPAREA
        </div>

        <!-- 🍄 2. CUSTOM MUSHROOM PLAYER -->
        <div class="custom-player">
            <button id="playPauseBtn" class="mushroom-btn" onclick="togglePlay()" title="Play / Pause">
                🍄
            </button>
            
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <span id="playerStateText" style="color: var(--comic-yellow); font-size: 0.7em; font-weight: bold; text-shadow: 1px 1px 2px #000;">
                    CLICK TO PLAY
                </span>
                <div style="display: flex; align-items: center; gap: 4px;">
                    <span style="font-size: 0.8em;">🔊</span>
                    <input type="range" id="volumeControl" class="volume-slider" min="0" max="1" step="0.05" value="0.8" oninput="changeVolume(this.value)">
                </div>
            </div>

            <!-- STREAM AUDIO -->
            <audio id="radioStream" src="https://or.mysonicserver.com/8050/stream" preload="none"></audio>
        </div>

        <!-- 📊 3. ΜΕΤΡΗΤΕΣ (Ακροατές / Συνδεδεμένοι / Επισκέπτες) -->
        <div class="stats-container">
            <div class="stat-item" title="Ακροατές Ραδιοφώνου">
                <span>🎧</span>
                <span id="sonic_listeners" class="stat-value">0</span>
            </div>
            <span>|</span>
            <div class="stat-item" title="Συνδεδεμένοι Χρήστες">
                <span style="color: #2ECC71;">🟢</span>
                <span id="online_users_count" class="stat-value">0</span>
            </div>
            <span>|</span>
            <div class="stat-item" title="Επισκέπτες Σελίδας">
                <span>👁️</span>
                <span id="page_visitors_count" class="stat-value">0</span>
            </div>
        </div>

        <!-- 4. ΚΟΥΜΠΙ ΕΙΣΟΔΟΥ -->
        <button onclick="openLoginModal()" class="login-btn-top">Είσοδος στο Chat</button>

    </div>

  <!-- 🎧 FLOATING DJ CARD (INDEX) -->
<div class="floating-dj-card">
    <!-- Η εικόνα με αυτόματο fallback σε περίπτωση που η Sonic επιστρέψει μαύρο/κενό -->
    <img id="sonic_dj_img" 
         src="https://or.mysonicserver.com/cp/widgets/player/single/default_dj.png" 
         onerror="this.src='https://or.mysonicserver.com/cp/widgets/player/single/default_dj.png';" 
         alt="DJ Photo">
         
    <div class="dj-details">
        <div id="sonic_dj">DJ ON AIR</div>
        <div id="sonic_title">Radio Parea Live</div>
        <div style="color:#D4AF37; font-size:0.8em; margin-top:5px; font-weight:bold; font-family: 'Orbitron', sans-serif;">
            ΑΚΡΟΑΤΕΣ: <span id="sonic_listeners">0</span>
        </div>
    </div>
</div>

<!-- WIDGET SCRIPT SONICPANEL -->
<script id="sonic_js" data-port="8050" src="https://or.mysonicserver.com/cp/widgets.js?v=254"></script>    <!-- 🖼️ ΕΛΕΥΘΕΡΟΣ ΧΩΡΟΣ ΓΙΑ ΤΗΝ ΕΙΚΟΝΑ BACKGROUND -->
    <div class="center-hero-space"></div>

    <!-- JS ΛΕΙΤΟΥΡΓΙΑΣ PLAYER, MODAL & STATS -->
    <script>
        const audio = document.getElementById('radioStream');
        const playBtn = document.getElementById('playPauseBtn');
        const stateText = document.getElementById('playerStateText');

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playBtn.classList.add('playing');
                stateText.innerText = "ON AIR 🎶";
                stateText.style.color = "#2ECC71";
            } else {
                audio.pause();
                playBtn.classList.remove('playing');
                stateText.innerText = "PAUSED 🍄";
                stateText.style.color = "#FFDE00";
            }
        }

        function changeVolume(val) {
            audio.volume = val;
        }

        // 1. ΛΕΙΤΟΥΡΓΙΕΣ MODAL & LOGIN
        function openLoginModal() {
            document.getElementById("loginModal").style.display = "block";
        }

        function closeLoginModal() {
            document.getElementById("loginModal").style.display = "none";
        }

        function loginWithGoogle() {
            const width = 500, height = 600;
            const left = (window.innerWidth - width) / 2;
            const top = (window.innerHeight - height) / 2;
            
            const authWindow = window.open('/google_login', 'GoogleLogin', 
                `width=${width},height=${height},top=${top},left=${left}`);

            const timer = setInterval(() => {
                if (authWindow.closed) {
                    clearInterval(timer);
                    window.location.reload(); 
                }
            }, 1000);
        }

        // 2. LIVE ΕΝΗΜΕΡΩΣΗ ΜΕΤΡΗΤΩΝ ONLINE & ΕΠΙΣΚΕΠΤΩΝ
        function updateSiteStats() {
            fetch('/api/stats')
                .then(response => {
                    if (!response.ok) throw new Error('Network response error');
                    return response.json();
                })
                .then(data => {
                    if (data.online_users !== undefined) {
                        document.getElementById('online_users_count').innerText = data.online_users;
                    }
                    if (data.page_visitors !== undefined) {
                        document.getElementById('page_visitors_count').innerText = data.page_visitors;
                    }
                })
                .catch(err => {
                    console.log("Αναμονή για σύνδεση με το Flask /api/stats endpoint");
                });
        }

        document.addEventListener("DOMContentLoaded", () => {
            updateSiteStats();
            setInterval(updateSiteStats, 10000);
        });
    </script>

    <!-- MODAL LOGIN -->
    <div id="loginModal" style="display:none; position:fixed; z-index:2000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter: blur(5px);">
        <div style="background:#1a1a2e; margin:5% auto; padding:25px; border:2px solid #F1C40F; width:320px; border-radius:15px; text-align:center; position:relative; box-shadow: 0 0 20px #F1C40F;">
            <span onclick="closeLoginModal()" style="position:absolute; right:15px; top:10px; cursor:pointer; color:#fff; font-size:28px;">&times;</span>
            <h2 style="font-family:'Orbitron'; color:#F1C40F; margin-bottom:20px;">ΕΙΣΟΔΟΣ</h2>
            
            <button onclick="loginWithGoogle()" style="background:#db4437; color:white; border:none; padding:12px; width:100%; border-radius:5px; cursor:pointer; font-weight:bold; margin-bottom:15px; display:flex; align-items:center; justify-content:center; gap:10px;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_Logo.svg" width="18"> Σύνδεση με Google
            </button>

            <p style="color:#666; margin: 10px 0;">ή</p>

            <form action="{{ url_for('login_page') }}" method="POST">
                <input type="text" name="username" placeholder="Username" required style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #333; background:#0f0f1e; color:white; box-sizing: border-box;">
                <input type="password" name="password" placeholder="Password" required style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #333; background:#0f0f1e; color:white; box-sizing: border-box;">
                <button type="submit" class="login-btn-top" style="width:100%; border:none; cursor:pointer; padding:10px;">ΕΙΣΟΔΟΣ</button>
            </form>
        </div>
    </div>
</body>
</html>
