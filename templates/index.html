<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radioparea - On Air</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    
   <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap');

    :root {
        --comic-yellow: #FFDE00;
        --comic-orange: #FF6B00;
        --text-color: #FFFFFF;
    }

    html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: 'Fredoka', cursive, sans-serif;
    }

    body { 
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 20px 10px;
        overflow-y: auto; 

        background-image: url("{{ url_for('static', filename='radiopareanewstyle.jpg') }}"); 
        background-size: 100% 100%;
        background-attachment: fixed;
        background-position: center center;
        background-repeat: no-repeat;
        background-color: #1a1a2e;
    }

    /* 🏷️ ΤΙΤΛΟΣ TOP */
    .top-header h1 { 
        font-size: 2.2em;
        font-weight: 700;
        color: var(--comic-yellow); 
        margin: 10px 0;
        text-transform: uppercase;
        text-align: center;
        -webkit-text-stroke: 1.5px #000;
        text-shadow: 3px 3px 0px #FF4500, 5px 5px 0px #000;
    }

    /* 📻 ΟΡΙΖΟΝΤΙΑ ΔΙΑΤΑΞΗ PLAYER & INFO */
    .main-wrapper {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 20px;
        width: 100%;
        max-width: 850px;
        background: rgba(0, 0, 0, 0.45); /* Ελαφριά διαφάνεια */
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        padding: 20px;
        border-radius: 20px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 8px 25px rgba(0,0,0,0.6);
    }

    .player-section {
        flex: 1 1 320px;
        max-width: 400px;
    }

    .info-section {
        flex: 1 1 300px;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .calligraphy-text-base {
        font-size: 1.5em; 
        font-weight: 700;
        color: var(--comic-yellow);
        margin-bottom: 5px;
        -webkit-text-stroke: 1px #000;
        text-shadow: 2px 2px 0px #FF6B00;
    }

    .dj-name-style {
        color: #FFF;
        -webkit-text-stroke: 1px #000;
        text-shadow: 2px 2px 0px #00A8FF;
    }

    #sonic_title {
        font-size: 0.95em;
        color: #FFF;
        margin: 8px 0;
        text-shadow: 1px 1px 2px #000;
    }

    /* 🔘 ΚΟΥΜΠΙ BOTTOM */
    .bottom-section {
        margin-top: 15px;
        margin-bottom: 10px;
    }

    .login-btn {
        background: linear-gradient(180deg, #2ECC71 0%, #27AE60 100%);
        color: #FFF; 
        border: 2px solid #000; 
        padding: 12px 35px; 
        border-radius: 50px; 
        cursor: pointer;
        font-family: 'Fredoka', cursive, sans-serif;
        font-size: 1.2em;
        font-weight: bold;
        text-transform: uppercase;
        box-shadow: 0 5px 0px #1e8449, 0 8px 10px rgba(0,0,0,0.4);
        transition: all 0.1s ease;
        -webkit-text-stroke: 0.5px #000;
    }
    
    .login-btn:hover { 
        transform: translateY(-2px);
        box-shadow: 0 7px 0px #1e8449, 0 10px 12px rgba(0,0,0,0.4);
    } 

    @media (max-width: 600px) {
        .main-wrapper {
            flex-direction: column;
        }
    }
</style>
</head>
<body>
    
    <!-- 1. ΤΙΤΛΟΣ ΠΑΝΩ -->
    <div class="top-header">
        <h1>📻 RADIOPAREA IS ON AIR</h1>
    </div>

    <!-- 2. ΟΡΙΖΟΝΤΙΑ ΔΙΑΤΑΞΗ PLAYER + INFO -->
    <div class="main-wrapper">
        <div class="player-section">
            <iframe src="https://or.mysonicserver.com/cp/widgets/player/single/?p=8050" height="110" width="100%" scrolling="no" style="border:none;"></iframe>
            <script id='sonic_js' data-port='8050' src='https://or.mysonicserver.com/cp/widgets.js?r=381'></script>
        </div>

        <div class="info-section">
            <div class="calligraphy-block">
                <span class="calligraphy-text-base">
                    RADIOPAREA ΜΕ <span id='sonic_dj' class='dj-name-style'></span>
                </span>
            </div>
            <div id='sonic_title'></div>
            <div id='dj_profile'></div>
            <div id='sonic_listeners' style="font-size: 0.9em; color: var(--comic-yellow);">ΑΚΡΟΑΤΕΣ</div>
        </div>
    </div>

    <!-- 3. ΚΟΥΜΠΙ ΚΑΤΩ -->
    <div class="bottom-section">
        <button onclick="openLoginModal()" class="login-btn">Είσοδος στο Chat</button>
    </div>

    <!-- Το Login Modal παραμένει όπως ήταν -->
    ...
</body>

    <script>
        // 1. ΛΕΙΤΟΥΡΓΙΕΣ MODAL & LOGIN
        function openLoginModal() {
            document.getElementById("loginModal").style.display = "block";
        }

        function closeLoginModal() {
            document.getElementById("loginModal").style.display = "none";
        }

        function loginWithGoogle() {
            const width = 500, height = 600;
            const left = (window.innerWidth - width) / 2;
            const top = (window.innerHeight - height) / 2;
            
            const authWindow = window.open('/google_login', 'GoogleLogin', 
                `width=${width},height=${height},top=${top},left=${left}`);

            const timer = setInterval(() => {
                if (authWindow.closed) {
                    clearInterval(timer);
                    window.location.reload(); 
                }
            }, 1000);
        }
    </script>

    <div id="loginModal" style="display:none; position:fixed; z-index:2000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter: blur(5px);">
        <div style="background:#1a1a2e; margin:5% auto; padding:25px; border:2px solid #F1C40F; width:320px; border-radius:15px; text-align:center; position:relative; box-shadow: 0 0 20px #F1C40F;">
            <span onclick="closeLoginModal()" style="position:absolute; right:15px; top:10px; cursor:pointer; color:#fff; font-size:28px;">&times;</span>
            <h2 style="font-family:'Orbitron'; color:#F1C40F; margin-bottom:20px;">ΕΙΣΟΔΟΣ</h2>
            
            <button onclick="loginWithGoogle()" style="background:#db4437; color:white; border:none; padding:12px; width:100%; border-radius:5px; cursor:pointer; font-weight:bold; margin-bottom:15px; display:flex; align-items:center; justify-content:center; gap:10px;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_Logo.svg" width="18"> Σύνδεση με Google
            </button>

            <p style="color:#666; margin: 10px 0;">ή</p>

            <form action="{{ url_for('login_page') }}" method="POST">
                <input type="text" name="username" placeholder="Username" required style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #333; background:#0f0f1e; color:white; box-sizing: border-box;">
                <input type="password" name="password" placeholder="Password" required style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #333; background:#0f0f1e; color:white; box-sizing: border-box;">
                <button type="submit" class="login-btn" style="width:100%; border:none; cursor:pointer;">ΕΙΣΟΔΟΣ</button>
            </form>
        </div>
    </div>
</body>
</html>
