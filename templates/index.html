<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radioparea - On Air</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --comic-yellow: #FFDE00;
            --comic-orange: #FF6B00;
            --text-color: #FFFFFF;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
            overflow-x: hidden;
        }

        body { 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
            box-sizing: border-box;

            /* BACKGROUND */
            background-image: url("{{ url_for('static', filename='radiopareanewstyle.jpg') }}"); 
            background-size: 100% 100%;
            background-attachment: fixed;
            background-position: center center;
            background-repeat: no-repeat;
            background-color: #1a1a2e;
        }

        /* 🚀 TOP HEADER BAR (ΤΕΡΜΑ ΠΑΝΩ) */
        .top-navbar {
            width: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 222, 0, 0.4);
            padding: 8px 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        /* 1. ΛΟΓΟΤΥΠΟ / ΤΙΤΛΟΣ (ΑΡΙΣΤΕΡΑ) */
        .brand-title {
            font-size: 1.3em;
            font-weight: 700;
            color: var(--comic-yellow); 
            text-transform: uppercase;
            white-space: nowrap;
            -webkit-text-stroke: 1px #000;
            text-shadow: 2px 2px 0px #FF4500;
        }

        /* 2. PLAYER (ΚΕΝΤΡΟ) */
        .player-compact {
            flex: 1;
            max-width: 380px;
            height: 80px;
        }

        .player-compact iframe {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        /* 3. METADATA & DJ INFO (ΜΕΣΗ - ΔΕΞΙΑ) */
        .info-compact {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            color: #FFF;
            text-shadow: 1px 1px 2px #000;
            font-size: 0.85em;
            max-width: 300px;
        }

        .dj-line {
            font-size: 1em;
            font-weight: bold;
            color: var(--comic-yellow);
            -webkit-text-stroke: 0.5px #000;
        }

        .dj-name-highlight {
            color: #00A8FF;
        }

        #sonic_title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 250px;
            color: #E0E0E0;
        }

        /* 4. ΚΟΥΜΠΙ LOGIN (ΔΕΞΙΑ) */
        .login-btn-top {
            background: linear-gradient(180deg, #2ECC71 0%, #27AE60 100%);
            color: #FFF; 
            border: 2px solid #000; 
            padding: 8px 18px; 
            border-radius: 30px; 
            cursor: pointer;
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 0.95em;
            font-weight: bold;
            text-transform: uppercase;
            white-space: nowrap;
            box-shadow: 0 4px 0px #1e8449;
            transition: all 0.1s ease;
            -webkit-text-stroke: 0.5px #000;
        }
        
        .login-btn-top:hover { 
            transform: translateY(-2px);
            box-shadow: 0 6px 0px #1e8449;
        }

        /* 🌾 ΕΛΕΥΘΕΡΟΣ ΧΩΡΟΣ ΣΤΟ ΚΕΝΤΡΟ */
        .center-hero-space {
            flex: 1; /* Παιρνει ολο το κενο υψος της οθονης */
        }

        /* Responsive για κινητά */
        @media (max-width: 850px) {
            .top-navbar {
                flex-wrap: wrap;
                justify-content: center;
            }
            .info-compact {
                display: none; /* Κρύβει τα πολλά κείμενα σε πολύ μικρές οθόνες */
            }
        }
    </style>
</head>
<body>
    
    <!-- 🚀 TOP NAVBAR -->
    <div class="top-navbar">
        
        <!-- 1. ΤΙΤΛΟΣ -->
        <div class="brand-title">
            📻 RADIOPAREA
        </div>

        <!-- 2. PLAYER -->
        <div class="player-compact">
            <iframe src="https://or.mysonicserver.com/cp/widgets/player/single/?p=8050" scrolling="no" style="border:none;"></iframe>
            <script id='sonic_js' data-port='8050' src='https://or.mysonicserver.com/cp/widgets.js?r=381'></script>
        </div>

        <!-- 3. DJ & ΤΡΑΓΟΥΔΙ -->
        <div class="info-compact">
            <div class="dj-line">
                DJ: <span id='sonic_dj' class='dj-name-highlight'></span>
            </div>
            <div id='sonic_title'></div>
            <div id='sonic_listeners' style="color: var(--comic-yellow); font-size: 0.8em;">ΑΚΡΟΑΤΕΣ</div>
        </div>

        <!-- 4. ΚΟΥΜΠΙ ΕΙΣΟΔΟΥ -->
        <button onclick="openLoginModal()" class="login-btn-top">Είσοδος στο Chat</button>

    </div>

    <!-- 🖼️ ΚΕΝΟΣ ΧΩΡΟΣ ΓΙΑ ΝΑ ΦΑΙΝΕΤΑΙ Η ΕΙΚΟΝΑ 100% -->
    <div class="center-hero-space"></div>
    <script>
        // 1. ΛΕΙΤΟΥΡΓΙΕΣ MODAL & LOGIN
        function openLoginModal() {
            document.getElementById("loginModal").style.display = "block";
        }

        function closeLoginModal() {
            document.getElementById("loginModal").style.display = "none";
        }

        function loginWithGoogle() {
            const width = 500, height = 600;
            const left = (window.innerWidth - width) / 2;
            const top = (window.innerHeight - height) / 2;
            
            const authWindow = window.open('/google_login', 'GoogleLogin', 
                `width=${width},height=${height},top=${top},left=${left}`);

            const timer = setInterval(() => {
                if (authWindow.closed) {
                    clearInterval(timer);
                    window.location.reload(); 
                }
            }, 1000);
        }
    </script>

    <div id="loginModal" style="display:none; position:fixed; z-index:2000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter: blur(5px);">
        <div style="background:#1a1a2e; margin:5% auto; padding:25px; border:2px solid #F1C40F; width:320px; border-radius:15px; text-align:center; position:relative; box-shadow: 0 0 20px #F1C40F;">
            <span onclick="closeLoginModal()" style="position:absolute; right:15px; top:10px; cursor:pointer; color:#fff; font-size:28px;">&times;</span>
            <h2 style="font-family:'Orbitron'; color:#F1C40F; margin-bottom:20px;">ΕΙΣΟΔΟΣ</h2>
            
            <button onclick="loginWithGoogle()" style="background:#db4437; color:white; border:none; padding:12px; width:100%; border-radius:5px; cursor:pointer; font-weight:bold; margin-bottom:15px; display:flex; align-items:center; justify-content:center; gap:10px;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_Logo.svg" width="18"> Σύνδεση με Google
            </button>

            <p style="color:#666; margin: 10px 0;">ή</p>

            <form action="{{ url_for('login_page') }}" method="POST">
                <input type="text" name="username" placeholder="Username" required style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #333; background:#0f0f1e; color:white; box-sizing: border-box;">
                <input type="password" name="password" placeholder="Password" required style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #333; background:#0f0f1e; color:white; box-sizing: border-box;">
                <button type="submit" class="login-btn" style="width:100%; border:none; cursor:pointer;">ΕΙΣΟΔΟΣ</button>
            </form>
        </div>
    </div>
</body>
</html>
