<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radioparea - On Air</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --comic-yellow: #FFDE00;
            --comic-orange: #FF6B00;
            --text-color: #FFFFFF;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Fredoka', cursive, sans-serif;
        }

        body { 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
            overflow-y: auto; 

            /* BACKGROUND */
            background-image: url("{{ url_for('static', filename='radiopareanewstyle.jpg') }}"); 
            background-size: 100% 100%;
            background-attachment: fixed;
            background-position: center center;
            background-repeat: no-repeat;
            background-color: #1a1a2e;
        }

        /* 1. ΤΙΤΛΟΣ ΠΑΝΩ */
        .top-header h1 { 
            font-size: 2.4em;
            font-weight: 700;
            color: var(--comic-yellow); 
            margin: 10px 0 20px 0;
            text-transform: uppercase;
            text-align: center;
            -webkit-text-stroke: 1.5px #000;
            text-shadow: 3px 3px 0px #FF4500, 5px 5px 0px #000;
        }

        /* 2. ΚΥΡΙΩΣ ΠΕΡΙΟΧΗ ΧΩΡΙΣ ΚΟΥΤΙ (GRID / FLEX) */
        .content-layout {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            max-width: 950px;
            gap: 30px;
            margin: auto 0;
        }

        /* ΑΡΙΣΤΕΡΗ ΠΛΕΥΡΑ: Player & Metadata */
        .left-column {
            flex: 1;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .player-wrapper iframe {
            width: 100%;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
        }

        .metadata-box {
            background: rgba(0, 0, 0, 0.35); /* Ελαφρύ τοπικό φόντο για αναγνωσιμότητα */
            backdrop-filter: blur(4px);
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFF;
            text-shadow: 1px 1px 3px #000;
        }

        #sonic_title {
            font-size: 1em;
            color: #FFF;
            margin-bottom: 5px;
        }

        #sonic_listeners {
            font-size: 0.9em;
            color: var(--comic-yellow);
            font-weight: bold;
        }

        /* ΔΕΞΙΑ ΠΛΕΥΡΑ: DJ Info */
        .right-column {
            flex: 1;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            padding: 15px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .dj-title-text {
            font-size: 1.6em; 
            font-weight: 700;
            color: var(--comic-yellow);
            margin-bottom: 8px;
            -webkit-text-stroke: 1px #000;
            text-shadow: 2px 2px 0px #FF6B00;
        }

        .dj-name-style {
            color: #FFF;
            -webkit-text-stroke: 1px #000;
            text-shadow: 2px 2px 0px #00A8FF;
        }

        /* 3. ΚΟΥΜΠΙ ΚΑΤΩ */
        .bottom-section {
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .login-btn {
            background: linear-gradient(180deg, #2ECC71 0%, #27AE60 100%);
            color: #FFF; 
            border: 2px solid #000; 
            padding: 12px 40px; 
            border-radius: 50px; 
            cursor: pointer;
            font-family: 'Fredoka', cursive, sans-serif;
            font-size: 1.25em;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 5px 0px #1e8449, 0 8px 10px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            -webkit-text-stroke: 0.5px #000;
        }
        
        .login-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 7px 0px #1e8449, 0 10px 12px rgba(0,0,0,0.5);
        }

        /* Responsive για κινητά */
        @media (max-width: 768px) {
            .content-layout {
                flex-direction: column;
                align-items: center;
            }
            .left-column, .right-column {
                width: 100%;
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    
    <!-- 1. ΤΙΤΛΟΣ -->
    <div class="top-header">
        <h1>📻 RADIOPAREA IS ON AIR</h1>
    </div>

    <!-- 2. ΑΡΙΣΤΕΡΑ (PLAYER + META) / ΔΕΞΙΑ (DJ) -->
    <div class="content-layout">
        
        <!-- ΑΡΙΣΤΕΡΑ -->
        <div class="left-column">
            <div class="player-wrapper">
                <iframe src="https://or.mysonicserver.com/cp/widgets/player/single/?p=8050" height="110" width="100%" scrolling="no" style="border:none;"></iframe>
                <script id='sonic_js' data-port='8050' src='https://or.mysonicserver.com/cp/widgets.js?r=381'></script>
            </div>

            <div class="metadata-box">
                <div id='sonic_title'></div>
                <div id='sonic_listeners'>ΑΚΡΟΑΤΕΣ</div>
            </div>
        </div>

        <!-- ΔΕΞΙΑ -->
        <div class="right-column">
            <div class="dj-title-text">
                RADIOPAREA ΜΕ <br><span id='sonic_dj' class='dj-name-style'></span>
            </div>
            <div id='dj_profile'></div>
        </div>

    </div>

    <!-- 3. ΚΟΥΜΠΙ -->
    <div class="bottom-section">
        <button onclick="openLoginModal()" class="login-btn">Είσοδος στο Chat</button>
    </div>

    <script>
        // 1. ΛΕΙΤΟΥΡΓΙΕΣ MODAL & LOGIN
        function openLoginModal() {
            document.getElementById("loginModal").style.display = "block";
        }

        function closeLoginModal() {
            document.getElementById("loginModal").style.display = "none";
        }

        function loginWithGoogle() {
            const width = 500, height = 600;
            const left = (window.innerWidth - width) / 2;
            const top = (window.innerHeight - height) / 2;
            
            const authWindow = window.open('/google_login', 'GoogleLogin', 
                `width=${width},height=${height},top=${top},left=${left}`);

            const timer = setInterval(() => {
                if (authWindow.closed) {
                    clearInterval(timer);
                    window.location.reload(); 
                }
            }, 1000);
        }
    </script>

    <div id="loginModal" style="display:none; position:fixed; z-index:2000; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.85); backdrop-filter: blur(5px);">
        <div style="background:#1a1a2e; margin:5% auto; padding:25px; border:2px solid #F1C40F; width:320px; border-radius:15px; text-align:center; position:relative; box-shadow: 0 0 20px #F1C40F;">
            <span onclick="closeLoginModal()" style="position:absolute; right:15px; top:10px; cursor:pointer; color:#fff; font-size:28px;">&times;</span>
            <h2 style="font-family:'Orbitron'; color:#F1C40F; margin-bottom:20px;">ΕΙΣΟΔΟΣ</h2>
            
            <button onclick="loginWithGoogle()" style="background:#db4437; color:white; border:none; padding:12px; width:100%; border-radius:5px; cursor:pointer; font-weight:bold; margin-bottom:15px; display:flex; align-items:center; justify-content:center; gap:10px;">
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_Logo.svg" width="18"> Σύνδεση με Google
            </button>

            <p style="color:#666; margin: 10px 0;">ή</p>

            <form action="{{ url_for('login_page') }}" method="POST">
                <input type="text" name="username" placeholder="Username" required style="width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #333; background:#0f0f1e; color:white; box-sizing: border-box;">
                <input type="password" name="password" placeholder="Password" required style="width:100%; padding:10px; margin-bottom:15px; border-radius:5px; border:1px solid #333; background:#0f0f1e; color:white; box-sizing: border-box;">
                <button type="submit" class="login-btn" style="width:100%; border:none; cursor:pointer;">ΕΙΣΟΔΟΣ</button>
            </form>
        </div>
    </div>
</body>
</html>
